name: proof
on: [push, pull_request, workflow_dispatch]
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: the exchange, the evaluator, the page and the pins (M6, M7) and the seal's own text
        run: node --test test/mesh.test.mjs test/page.test.mjs
      - name: both runs and the whole trade re-derived from the training pools, byte for byte (M2-M5)
        run: node tools/exchange.mjs --check
      - name: the H record re-derived byte for byte (M1)
        run: node tools/eval.mjs --check
      # Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness - try to break each kernel, then READ the verdict (must be CLEAN, nothing baselined)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          for k in exchange eval; do
            node /tmp/witness/witness.mjs mutate "src/$k.mjs" --timeout 180000 --cap 1000 --test node --test test/mesh.test.mjs > "verdict-$k.txt" 2>&1
            tail -3 "verdict-$k.txt"
            grep -q '"clean": true' "verdict-$k.txt" || { echo "::error::mutants survived in src/$k.mjs"; exit 1; }
            node tools/gate-receipt.mjs "$k" "src/$k.mjs" "verdict-$k.txt" --check
          done
